[package]
name = "modellverkstan"
version = "0.1.0"
edition = "2021"
description = "Bygg och testa enkla systemmodeller – orsaksdiagram och lager/flöden för teknikundervisning."
license = "MIT"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rfd = "0.15"

[dev-dependencies]
# Bara för `cargo run --example make_icon`, som ritar ikonen.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
