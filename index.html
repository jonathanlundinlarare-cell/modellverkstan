<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Bygg och testa enkla systemmodeller – orsaksdiagram och lager/flöden – direkt i webbläsaren." />
    <title>Modellverkstan</title>
    <link data-trunk rel="rust" data-bin="modellverkstan" />
    <link data-trunk rel="icon" href="assets/icon-256.png" />
    <link data-trunk rel="copy-file" href="assets/icon-256.png" />
    <link rel="apple-touch-icon" href="icon-256.png" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fbfaf6; }
        canvas { display: block; width: 100%; height: 100%; outline: none; }
        #loading {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #26344a; gap: 14px;
        }
        #loading .logo { font-size: 28px; font-weight: 700; color: #2563aa; }
        #loading .bar { width: 180px; height: 6px; border-radius: 3px; background: #e2e0d8; overflow: hidden; }
        #loading .bar::after {
            content: ""; display: block; width: 40%; height: 100%; background: #2563aa; border-radius: 3px;
            animation: slide 1.1s ease-in-out infinite;
        }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading">
        <div class="logo">◆ Modellverkstan</div>
        <div class="bar"></div>
        <div>Laddar…</div>
    </div>
</body>
</html>
